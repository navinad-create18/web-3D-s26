<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Homework 6</title>
        <link rel="stylesheet" type="text/css" href="./style.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Cascadia+Code:ital,wght@0,200..700;1,200..700&display=swap"
            rel="stylesheet" />
       
        <!-- Needed for Three.js resources to connect to script. -->
        <script type="importmap">
			{
				"imports": {
					"three": "./src/three.module.js",
					"three/addons/": "./src/"
				}
			}
		</script>
        <!-- Three.js scene script, must contain module type. -->
        <script type= "module" src="./script.js"></script>
    </head>
    <body>
        <main>
            <div id="blocker">
			<div id="instructions">
				<p style="font-size:36px">
					Homework 6
				</p>
				<p>
					Move: WASD<br/>
					Jump: SPACE<br/>
					Look: MOUSE
				</p>
			</div>
		</div>
            <!--
            <h1>Three.js Base</h1>
            <h2 class="subtitle">
                A basic Three.js scene.
            </h2>
            -->
            <!-- Div for Three.js scene. -->
            <div id="3-holder"></div>
            
            <!-- Code from bloom reference on three.js examples-->
            <script type="x-shader/x-vertex" id="vertexshader">

			varying vec2 vUv;

			void main() {

				vUv = uv;

				gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );

			}

		</script>

		<script type="x-shader/x-fragment" id="fragmentshader">

			uniform sampler2D baseTexture;
			uniform sampler2D bloomTexture;
			uniform float bloomStrength;

			varying vec2 vUv;

			void main() {

				gl_FragColor = ( texture2D( baseTexture, vUv ) + texture2D( bloomTexture, vUv ) * bloomStrength );

			}

		</script>
        </main>
    </body>
</html>
