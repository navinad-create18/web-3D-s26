<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js css3d - periodic table</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="style.css">
	</head>
	<body>

		<div id="info"><a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> css3d - periodic table.</div>
		<div id="container"></div>
		<div id="menu">
			<!--<button id="table">TABLE</button>-->
			<!--<button id="sphere">SPHERE</button>-->
			<button id="helix">Explore</button>
			<!--<button id="grid">GRID</button>-->
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "./src/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>
		
		<!--Script for popovers-->
		<div popover="auto" id="elementPopover">
			<div class="popover-text">
				<h2 id="projectTitle">Project</h2>
				<p id="projectText"></p>
				
				<button id="closeButton">Explore More</button>
			</div>
		</div>
		
		
<!--Link to referenced code: https://threejs.org/examples/#css3d_periodictable -->
		<script type="module">

			import * as THREE from 'three';

			import TWEEN from './src/tween.module.js';
			import { OrbitControls } from './src/OrbitControls.js';
			import { CSS3DRenderer, CSS3DObject } from './src/CSS3DRenderer.js';

			const table = [
			
				'Project 1', 'Year', 'explore', 8, 4,
				'Project 2', 'Year', 'explore', 9, 4,
				'Project 3', 'Year', 'explore', 10, 4,
				'Project 4', 'Year', 'explore', 11, 4,
				'Project 5', 'Year', 'explore', 12, 4,
				
				'Project 6', 'Year', 'explore', 8, 5,
				'Project 7', 'Year', 'explore', 9, 5,
				'Project 8', 'Year', 'explore', 10, 5,
				'Project 9', 'Year', 'explore', 11, 5,
				'Project 10', 'Year', 'explore', 12, 5,
				
				'Project 11', 'Year', 'explore', 8, 6,
				'Project 12', 'Year', 'explore', 9, 6,
				'Project 13', 'Year', 'explore', 10, 6,
				'Project 14', 'Year', 'explore', 11, 6,
				'Project 15', 'Year', 'explore', 12, 6,
				
			];

			let camera, scene, renderer;
			let controls;
			

			const objects = [];
			const targets = { table: [], helix: []};

			init();
			animate();

			function init() {

				camera = new THREE.PerspectiveCamera( 60, window.innerWidth / window.innerHeight, 1, 10000 );
				camera.position.z = 2000;

				scene = new THREE.Scene();

				// table

				for ( let i = 0; i < table.length; i += 5 ) {

					const element = document.createElement( 'div' );
					element.className = 'element';
					element.style.pointerEvents = 'auto';
					element.style.backgroundColor = 'rgba(0,127,127,' + ( Math.random() * 0.5 + 0.25 ) + ')';

					//const number = document.createElement( 'div' );
					//number.className = 'number';
					//number.textContent = ( i / 5 ) + 1;
					//element.appendChild( number );

					const symbol = document.createElement( 'div' );
					symbol.className = 'symbol';
					symbol.textContent = table[ i ];
					element.appendChild( symbol );

					const details = document.createElement( 'div' );
					details.className = 'details';
					details.innerHTML = table[ i + 1 ] + '<br>' + table[ i + 2 ];
					element.appendChild( details );
					
					//Popover click
					let startX = 0;
let startY = 0;

element.addEventListener('pointerdown', (event) => {

    startX = event.clientX;
    startY = event.clientY;

});

element.addEventListener('pointerup', (event) => {

    const dx = event.clientX - startX;
    const dy = event.clientY - startY;

    const distance = Math.sqrt(dx * dx + dy * dy);

    // treat as click if mouse barely moved
    if (distance < 5) {

        document.getElementById('projectTitle').textContent = table[i];

        document.getElementById('projectText').textContent =
            'Text: ' + table[i + 1];

        document.getElementById('elementPopover').showPopover();

    }

});

					const objectCSS = new CSS3DObject( element );
					objectCSS.position.x = Math.random() * 4000 - 2000;
					objectCSS.position.y = Math.random() * 4000 - 2000;
					objectCSS.position.z = Math.random() * 4000 - 2000;
					scene.add( objectCSS );

					objects.push( objectCSS );

					//

					const object = new THREE.Object3D();
					object.position.x = ( table[ i + 3 ] * 140 ) - 1330;
					object.position.y = - ( table[ i + 4 ] * 180 ) + 990;

					targets.table.push( object );

				}

				// sphere

				const vector = new THREE.Vector3();
//
				//for ( let i = 0, l = objects.length; i < l; i ++ ) {
//
				//	const phi = Math.acos( - 1 + ( 2 * i ) / l );
				//	const theta = Math.sqrt( l * Math.PI ) * phi;
//
				//	const object = new THREE.Object3D();
//
				//	object.position.setFromSphericalCoords( 800, phi, theta );
//
				//	vector.copy( object.position ).multiplyScalar( 2 );
//
				//	object.lookAt( vector );
//
				//	targets.sphere.push( object );
//
				//}

				// helix

				for ( let i = 0, l = objects.length; i < l; i ++ ) {

					const theta = i * 1.5 + Math.PI;
					const y = 200;

					const object = new THREE.Object3D();

					object.position.setFromCylindricalCoords( 500, theta, y );

					vector.x = object.position.x*2;
					vector.y = object.position.y;
					vector.z = object.position.z*2;

					object.lookAt( vector );

					targets.helix.push( object );

				}

				// grid

				//for ( let i = 0; i < objects.length; i ++ ) {
//
				//	const object = new THREE.Object3D();
//
				//	object.position.x = ( ( i % 5 ) * 400 ) - 800;
				//	object.position.y = ( - ( Math.floor( i / 5 ) % 5 ) * 400 ) + 800;
				//	object.position.z = ( Math.floor( i / 25 ) ) * 1000 - 2000;
//
				//	targets.grid.push( object );
//
				//}

				//

				renderer = new CSS3DRenderer();
				renderer.setSize( window.innerWidth, window.innerHeight );
				document.getElementById( 'container' ).appendChild( renderer.domElement );

				//

				// Setup controls
                controls = new OrbitControls( camera, renderer.domElement );
                controls.listenToKeyEvents( window ); 
                controls.enableDamping = true; 
                controls.dampingFactor = 0.05;
                controls.screenSpacePanning = false;
                controls.minDistance = 100;
                controls.maxDistance = 3000;
                controls.cursorStyle = 'grab';
                controls.maxPolarAngle = Math.PI / 2;
                controls.minPolarAngle = Math.PI /2;
			
	

				//const buttonTable = document.getElementById( 'table' );
				//buttonTable.addEventListener( 'click', function () {
//
				//	transform( targets.table, 2000 );
//
				//} );

				//const buttonSphere = document.getElementById( 'sphere' );
				//buttonSphere.addEventListener( 'click', function () {
//
				//	transform( targets.sphere, 2000 );
//
				//} );

				const buttonHelix = document.getElementById( 'helix' );
				buttonHelix.addEventListener( 'click', function () {

					transform( targets.helix, 2000 );

				} );

				//const buttonGrid = document.getElementById( 'grid' );
				//buttonGrid.addEventListener( 'click', function () {
//
				//	transform( targets.grid, 2000 );
//
				//} );

				transform( targets.table, 2000 );

				//

				window.addEventListener( 'resize', onWindowResize );

			}
			
			document.getElementById ('closeButton').addEventListener('click', ()=>{
				document.getElementById('elementPopover').hidePopover();
			 });

			function transform( targets, duration ) {

				TWEEN.removeAll();

				for ( let i = 0; i < objects.length; i ++ ) {

					const object = objects[ i ];
					const target = targets[ i ];

					new TWEEN.Tween( object.position )
						.to( { x: target.position.x, y: target.position.y, z: target.position.z }, Math.random() * duration + duration )
						.easing( TWEEN.Easing.Exponential.InOut )
						.start();

					new TWEEN.Tween( object.rotation )
						.to( { x: target.rotation.x, y: target.rotation.y, z: target.rotation.z }, Math.random() * duration + duration )
						.easing( TWEEN.Easing.Exponential.InOut )
						.start();

				}

				new TWEEN.Tween( this )
					.to( {}, duration * 2 )
					.start();
                
			}
               

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

				render();

			}

			function animate() {
                
                controls.update();
				requestAnimationFrame( animate );
				TWEEN.update();
                render(); 
			}

			function render() {

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
